<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1419" />
    <title>Market Board</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Local Market MVP</p>
          <h1>成交额榜单</h1>
        </div>
        <div class="topbar-actions">
          <a class="status-link" href="/status.html">状态</a>
          <button class="icon-button" id="refreshButton" type="button" aria-label="刷新榜单">
            ↻
          </button>
        </div>
      </header>

      <nav class="tabs" aria-label="榜单切换">
        <button class="tab is-active" type="button" data-board="ETF_FOCUS20">ETF</button>
        <button class="tab" type="button" data-board="CRYPTO_TURNOVER_TOP50">Crypto</button>
        <button class="tab" type="button" data-board="CRYPTO_FUTURES_TURNOVER_TOP50">Futures</button>
        <button class="tab" type="button" data-board="CRYPTO_FUTURES_TRADFI_TURNOVER_TOP50">TradeFi</button>
      </nav>

      <section class="board-meta" aria-live="polite">
        <span id="boardName">ETF_FOCUS20</span>
        <span id="snapshotTime">--</span>
      </section>

      <section class="board-list" id="boardList" aria-live="polite"></section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>

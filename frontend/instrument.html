<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1419" />
    <title>Instrument Detail</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <a class="back-link" href="/">返回榜单</a>
          <h1 id="instrumentTitle">--</h1>
        </div>
        <button class="icon-button" id="refreshButton" type="button" aria-label="刷新标的">
          ↻
        </button>
      </header>

      <section class="detail-panel" aria-live="polite">
        <div>
          <p class="label">最新价</p>
          <p class="value" id="lastPrice">--</p>
        </div>
        <div>
          <p class="label">涨跌幅</p>
          <p class="value" id="changePct">--</p>
        </div>
        <div>
          <p class="label">成交额</p>
          <p class="value" id="turnover">--</p>
        </div>
        <div>
          <p class="label">成交量</p>
          <p class="value" id="volume">--</p>
        </div>
      </section>

      <section class="data-section">
        <div class="chart-header">
          <div>
            <h2 id="intradayTitle">K 线 --</h2>
            <p class="chart-timezone" id="chartTimezone">图表时区 -- / 原始时间 UTC</p>
          </div>
          <div class="period-tabs" id="periodTabs" aria-label="K 线周期"></div>
        </div>
        <div class="chart-panel" id="klineChart" aria-label="K 线图"></div>
        <div class="chart-actions">
          <button class="secondary-button" id="loadMoreBars" type="button" disabled>更早</button>
          <span class="chart-range-hint" id="chartRangeHint">--</span>
        </div>
        <p class="chart-credit">
          Chart engine: <a href="https://klinecharts.com/" target="_blank" rel="noreferrer">KLineCharts</a>
        </p>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/klinecharts@9.8.12/dist/umd/klinecharts.min.js"></script>
    <script src="/instrument.js" defer></script>
  </body>
</html>
